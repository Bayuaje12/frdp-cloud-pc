name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build does not require real secrets for static/compile checks in most cases;
          # provide safe placeholders if required by code paths at build time.
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_SECRET: "ci-placeholder-secret-not-for-production"
          GITHUB_CLIENT_ID: "ci-placeholder"
          GITHUB_CLIENT_SECRET: "ci-placeholder"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/frdp?schema=public"
